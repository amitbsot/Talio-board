<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talio-board</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #4a4a4a;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh;
            overflow-y: auto; overflow-x: hidden;
            touch-action: manipulation;
        }
        .lang-toggle-container {
            position: absolute; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 8px;
            z-index: 150; font-weight: bold; font-size: 14px;
        }
        [dir="ltr"] .lang-toggle-container { right: auto; left: 20px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #3498DB; }
        input:checked + .slider:before { transform: translateX(20px); }
        .lang-label { color: #aaa; transition: 0.3s; }
        .lang-active { color: #3498DB; font-weight: 900; }
 
        #lobby {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(253, 251, 247, 0.98);
            display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; padding-top: 20px; z-index: 100;
        }
        #lobby h1, #lobby h3 { margin-top: 0; }
        .room-input {
            width: 80%; max-width: 300px; padding: 15px; font-size: 20px;
            margin-top: 10px; margin-bottom: 25px; border: 2px solid #dcd5c6;
            border-radius: 12px; text-align: center; background-color: #fff; color: #333;
        }
        .btn-join-room {
            background-color: #3498DB; color: white; padding: 15px 30px; font-size: 22px;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 0 #2980B9; transition: transform 0.1s;
        }
        .btn-join-room:active { transform: translateY(4px); box-shadow: none; }
 
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content {
            background-color: #fff; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .settings-group { margin-bottom: 20px; }
        .settings-group h4 { margin: 0 0 10px 0; color: #555; font-size: 18px; }
        .diff-buttons { display: flex; gap: 8px; justify-content: center; }
        .diff-btn {
            flex: 1; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 10px;
            border: 2px solid #ddd; cursor: pointer; background-color: #f9f9f9; color: #666; transition: all 0.2s;
        }
        #modal-team-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .team-btn {
            padding: 12px 15px; font-size: 16px; border-radius: 10px;
            border: 3px solid transparent; cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        .team-btn.blue   { background-color: #D6EAF8; color: #2874A6; }
        .team-btn.red    { background-color: #FADBD8; color: #943126; }
        .team-btn.purple { background-color: #E8DAEF; color: #6C3483; }
        .team-btn.green  { background-color: #D5F5E3; color: #1E8449; }
        .team-btn.yellow { background-color: #FCF3CF; color: #B7950B; }
 
        #shared-board {
            background-color: #f4f1ea; padding: 15px 10px; text-align: center;
            border-bottom: 3px solid #e0dcd3; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10;
            display: none;
        }
        .game-title {
            font-size: 26px; font-weight: 900; color: #f39c12; letter-spacing: 1px;
            margin-bottom: 5px; flex: 1; text-align: right;
        }
        [dir="ltr"] .game-title { text-align: left; }
        .board-grid {
            display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
            margin: 10px auto; max-width: 600px; padding: 10px;
            background-color: #ffffff; border-radius: 12px; border: 2px solid #e0dcd3;
        }
        .square {
            width: 35px; height: 35px; background-color: #faf9f5;
            border: 1px solid #ece8e0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #aaa; font-weight: bold;
        }
        .square.finish { border: 2px solid #f39c12; color: #f39c12; background-color: #fef9e7; }
        .top-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; padding: 0 10px; }
        #timer { font-size: 40px; font-weight: bold; color: #e74c3c; margin-top: 5px; }
 
        #personal-area {
            padding: 20px 10px 40px 10px; flex: 1;
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        .card {
            background-color: white; color: #333; width: 90%; max-width: 350px; border-radius: 20px;
            padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 20px; margin-top: 10px; border: 1px solid #f0f0f0;
            transition: opacity 0.3s ease, background-color 0.4s ease;
        }
        .fade-out { opacity: 0 !important; }
        #card-role-title {
            font-size: 18px; font-weight: bold; color: #444; margin-bottom: 15px;
            background-color: rgba(255,255,255,0.7); padding: 8px; border-radius: 8px; border: 1px dashed #ccc;
        }
        .main-word-container {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            margin-bottom: 10px; border-bottom: 2px dashed rgba(0,0,0,0.1); padding-bottom: 10px;
        }
        .main-word { font-size: 32px; font-weight: 900; color: #2c3e50; }
        .card-icon  { font-size: 40px; }
        .taboo-list { list-style: none; padding: 0; margin: 0; font-size: 20px; color: #c0392b; font-weight: bold; }
        .taboo-list li { margin: 8px 0; }
        .controls { display: flex; width: 95%; max-width: 400px; gap: 15px; }
        button.action-btn {
            flex: 1; padding: 18px 10px; font-size: 20px; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer; color: #333;
        }
        .btn-correct { background-color: #A9DFBF; box-shadow: 0 4px 0 #7DCEA0; }
        .btn-skip    { background-color: #F5B7B1; box-shadow: 0 4px 0 #F1948A; }
        .btn-start {
            background-color: #A9DFBF; color: #1E8449; width: 90%; max-width: 350px; margin-top: 20px;
            box-shadow: 0 4px 0 #7DCEA0; border: none; padding: 18px; font-size: 22px; font-weight: bold;
            border-radius: 12px; cursor: pointer; transition: all 0.1s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }
        .hidden { display: none !important; }
        .message-box {
            background-color: #e8f8f5; color: #117a65; padding: 15px; border-radius: 10px;
            text-align: center; font-size: 18px; font-weight: bold;
            width: 90%; max-width: 350px; margin-top: 20px; border: 1px solid #d1f2eb;
        }
        .error-box {
            background-color: #fadbd8; color: #922b21; padding: 12px 18px; border-radius: 10px;
            text-align: center; font-size: 17px; font-weight: bold;
            width: 90%; max-width: 350px; margin-top: 10px; border: 2px solid #e74c3c;
            animation: errPulse 0.35s ease;
        }
        @keyframes errPulse { 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
        .players-count { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; font-weight: bold; }
        .loader {
            border: 5px solid #f3f3f3; border-top: 5px solid #3498db;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 400px) {
            .square { width: 28px; height: 28px; font-size: 10px; border-radius: 6px; }
            .btn-start { font-size: 18px; }
        }
    </style>
</head>
<body>
 
<div id="lobby">
    <div class="lang-toggle-container">
        <span id="lbl-he" class="lang-label lang-active">HE</span>
        <label class="switch">
            <input type="checkbox" id="lang-toggle-btn" onchange="toggleLanguage()">
            <span class="slider"></span>
        </label>
        <span id="lbl-en" class="lang-label">EN</span>
    </div>
    <h1 class="game-title" style="font-size:42px;margin-top:50px;margin-bottom:10px;text-align:center;width:100%;">TALIO-BOARD</h1>
    <h3 id="txt-enter-room" style="margin-bottom:20px;color:#777;">הכנס שם חדר להתחלה:</h3>
    <input type="text" id="room-input" class="room-input" placeholder="שם החדר (למשל: משפחת כהן)">
    <p id="room-input-error" style="color:#e74c3c;font-size:13px;margin:0 0 10px 0;display:none;"></p>
    <button id="btn-join" class="btn-join-room" onclick="enterRoom()">היכנס לחדר</button>
</div>
 
<!-- Setup / Settings Modal -->
<div id="setup-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="modal-title">הגדרות חדר</h2>
        <div id="non-admin-note" class="hidden" style="color:#e74c3c;font-weight:bold;font-size:14px;margin-bottom:15px;"></div>
 
        <div class="settings-group" id="difficulty-group">
            <h4 id="txt-difficulty">רמת קושי</h4>
            <div class="diff-buttons">
                <button class="diff-btn" id="diff-easy"   onclick="setDifficulty('easy')">קל</button>
                <button class="diff-btn" id="diff-medium" onclick="setDifficulty('medium')">בינוני</button>
                <button class="diff-btn" id="diff-hard"   onclick="setDifficulty('hard')">קשה</button>
            </div>
        </div>
 
        <div class="settings-group" id="team-selection-group">
            <h4 id="txt-select-team">בחירת קבוצה</h4>
            <div id="modal-team-buttons">
                <button class="team-btn blue"   id="team-blue"   onclick="selectTeam('blue')">תכלת</button>
                <button class="team-btn red"    id="team-red"    onclick="selectTeam('red')">ורודה</button>
                <button class="team-btn purple" id="team-purple" onclick="selectTeam('purple')">סגולה</button>
                <button class="team-btn green"  id="team-green"  onclick="selectTeam('green')">ירוקה</button>
                <button class="team-btn yellow" id="team-yellow" onclick="selectTeam('yellow')">צהובה</button>
            </div>
        </div>
 
        <!-- First-time admin (before game starts) -->
        <div id="admin-setup-controls" class="hidden">
            <button id="btn-modal-start" class="btn-start" style="width:100%;margin-top:10px;" onclick="startGame()">התחל משחק</button>
        </div>
 
        <!-- In-game settings (gear icon) -->
        <div id="admin-edit-controls" class="hidden">
            <button id="btn-change-teams"
                style="width:100%;margin-bottom:15px;padding:12px;border-radius:12px;border:2px solid #e67e22;background:#fdf2e9;color:#d35400;font-weight:bold;cursor:pointer;"
                onclick="restartToTeamSelection()">החלפת קבוצות (התחל מחדש)</button>
            <button id="btn-end-game"
                style="width:100%;margin-bottom:15px;padding:12px;border-radius:12px;border:2px solid #c0392b;background:#fadbd8;color:#900;font-weight:bold;cursor:pointer;"
                onclick="endGameAndReset()">סיים משחק (מחק חדר)</button>
            <p id="edit-warning" style="color:#e74c3c;font-size:14px;font-weight:bold;margin-bottom:15px;">שינוי הגדרות יתחיל את המשחק מחדש</p>
            <div style="display:flex;gap:10px;">
                <button id="btn-modal-confirm" class="btn-start" style="flex:1;margin-top:0;" onclick="confirmSettings()">אישור</button>
                <button id="btn-modal-cancel"
                    style="flex:1;padding:18px;border-radius:12px;border:2px solid #ccc;background:#eee;font-weight:bold;cursor:pointer;"
                    onclick="closeModal()">ביטול</button>
            </div>
        </div>
 
        <!-- Non-admin waiting message (before game starts) -->
        <div id="non-admin-msg" class="hidden" style="margin-top:20px;color:#777;font-weight:bold;font-size:16px;">
            ממתין למנהל החדר שיתחיל את המשחק...
        </div>
    </div>
</div>
 
<!-- Winner Modal -->
<div id="winner-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h1 id="winner-title" style="font-size:30px;margin-top:0;margin-bottom:10px;"></h1>
        <div id="winner-admin-controls" class="hidden">
            <button id="btn-restart-game" class="btn-start" onclick="restartToTeamSelection()" style="width:100%;margin-top:20px;">התחל מחדש</button>
        </div>
        <div id="winner-non-admin-msg" class="hidden" style="margin-top:20px;color:#777;font-weight:bold;font-size:16px;">
            ממתין למנהל החדר שיתחיל מחדש...
        </div>
    </div>
</div>
 
<!-- Main board -->
<div id="shared-board">
    <div class="top-info">
        <div style="display:flex;gap:10px;align-items:flex-start;flex:2;">
            <button id="btn-settings" class="hidden"
                style="font-size:24px;background:none;border:none;cursor:pointer;padding:0;"
                onclick="openSettings()">⚙️</button>
            <div style="display:flex;flex-direction:column;align-items:flex-start;">
                <div id="player-info-display"
                    style="font-size:14px;font-weight:bold;padding:5px 10px;border-radius:8px;transition:all 0.3s;"></div>
            </div>
        </div>
        <div class="game-title">TALIO</div>
    </div>
    <div id="players-count" class="players-count">ממתין לשחקנים...</div>
    <div class="board-grid" id="board-grid"></div>
    <div id="timer">01:00</div>
    <div id="status" style="margin-top:5px;color:#888;font-weight:bold;transition:font-size 0.3s;">ממתין לשחקנים...</div>
</div>
 
<div id="personal-area">
    <button id="btn-start-turn" class="btn-start hidden">התחל תור</button>
    <div id="role-message" class="message-box hidden"></div>
    <div id="last-card-error" class="error-box hidden"></div>
 
    <div id="shuffling-ui" class="message-box hidden"
        style="background-color:#fff3cd;color:#856404;border-color:#ffeeba;">
        <h3 id="txt-shuffling" style="margin-top:0;">מערבב חפיסה מחדש...</h3>
        <div class="loader" id="shuffling-loader"></div>
        <button id="btn-resume-play" class="btn-start hidden" onclick="resumePlay()"
            style="width:100%;margin-top:10px;">חזור לשחק</button>
    </div>
 
    <div id="card-container" class="card hidden">
        <div id="card-role-title"></div>
        <div class="main-word-container">
            <span id="card-icon" class="card-icon">🖼️</span>
            <span class="main-word" id="main-word">מילה</span>
        </div>
        <ul class="taboo-list" id="taboo-words"></ul>
    </div>
 
    <div id="controls" class="controls hidden">
        <button id="btn-skip"    class="action-btn btn-skip">פס / דילוג</button>
        <button id="btn-correct" class="action-btn btn-correct">הצליחו!</button>
    </div>
</div>
 
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {
    getDatabase, ref, set, onValue, update, get, remove, onDisconnect, runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
 
const firebaseConfig = {
    apiKey:      "AIzaSyDiGUmCG08Ke6JYYR_gW6r-JMwdxt0aJDk",
    authDomain:  "talio-board.firebaseapp.com",
    databaseURL: "https://talio-board-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:   "talio-board"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
 
let lang = 'he';
 
const CARDS_HE = [
    {word:"כלב",     icon:"🐶", taboo:["חיה","נבחן","חתול","עצם","רצועה","זנב"]},
    {word:"שמש",     icon:"☀️", taboo:["יום","אור","חם","שמיים","צהוב","כוכב"]},

    {word:"ים",      icon:"🌊", taboo:["מים","חול","גלים","קיץ","מטקות","מלח"]},

    {word:"רופא",    icon:"👨‍⚕️", taboo:["חולה","בית חולים","תרופה","מרפאה","בריאות","סטטוסקופ"]},
    {word:"שוקולד",  icon:"🍫", taboo:["מתוק","קקאו","חום","פרה","טעים","חפיסה"]},
    {word:"שעון",    icon:"⌚", taboo:["זמן","מחוגים","יד","שעה","לענוד","מעורר"]},

    {word:"Dog",       icon:"🐶", taboo:["Animal","Bark","Cat","Bone","Leash","Tail"]},

console.assert(CARDS_HE.length === CARDS_EN.length);
const DECK_SIZE = CARDS_HE.length;

function shuffleArray(a) {
    a = [...a];
    for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
}
function freshDeck() { return shuffleArray(Array.from({length:DECK_SIZE},(_,i)=>i)); }
function formatTime(s) {
    s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60),r=s%60;
    return `${m<10?'0'+m:m}:${r<10?'0'+r:r}`;
}
function hasInvalidChars(n) { return /[.#$[\]/]/.test(n); }

class GameTurnManager {
    constructor(roomRef,playerId){this.roomRef=roomRef;this.playerId=playerId;this.currentState=null;this.events={onStateUpdate:()=>{}};}
    _buildInitialState(){
        const deck=freshDeck();
        return {adminId:this.playerId,gameStarted:false,difficulty:'medium',
            teams:[{id:'blue',players:{},score:0},{id:'red',players:{},score:0},{id:'purple',players:{},score:0},{id:'green',players:{},score:0},{id:'yellow',players:{},score:0}],
            currentTeamIndex:0,turnStatus:'transitioning',turnStartTime:null,turnDuration:60,
            deck,currentCardIndex:deck[0],describerId:null,lastDescriberId:null,resetTimestamp:null};
    }
    async connect(){const init=this._buildInitialState();await runTransaction(this.roomRef,cur=>cur===null?init:cur);}
    async registerPresence(){
        const roomKey=this.roomRef.key;
        // Wipe any stale presence + team slots from a previous session
        const staleSnap=await get(this.roomRef).catch(()=>null);
        if(staleSnap&&staleSnap.val()){
            const sv=staleSnap.val();
            // Remove stale presence
            try{await remove(ref(db,`rooms/${roomKey}/players/${myPlayerId}`));}catch(e){}
            // Remove stale team memberships
            if(sv.teams){
                for(let i=0;i<sv.teams.length;i++){
                    if(sv.teams[i].players&&sv.teams[i].players[myPlayerId]){
                        try{await remove(ref(db,`rooms/${roomKey}/teams/${i}/players/${myPlayerId}`));}catch(e){}
                    }
                }
            }
        }
        const pr=ref(db,`rooms/${roomKey}/players/${myPlayerId}`);
        await set(pr,{joinTime:myJoinTime,active:true});
        onDisconnect(pr).remove();
    }
    listenToState(){
        // Detach previous listener to prevent duplicate subscriptions on re-entry
        if(this._unsub){this._unsub();this._unsub=null;}
        this._unsub=onValue(this.roomRef,snap=>{
            const s=snap.val();
            if(!s){goToLobby();return;}
            if(s.resetTimestamp&&myJoinTime&&s.resetTimestamp>myJoinTime){goToLobby();return;}
            this.currentState=s;
            if(s.teams)s.teams.forEach(t=>{t.playerCount=t.players?Object.keys(t.players).length:0;});
            const allPlayers=s.players?Object.keys(s.players):[];
            if(allPlayers.length===1&&allPlayers[0]===this.playerId){onDisconnect(this.roomRef).remove();}
            else{onDisconnect(this.roomRef).cancel();const pr=ref(db,`rooms/${this.roomRef.key}/players/${this.playerId}`);onDisconnect(pr).remove();}
            // Admin transfer
            const adminPresent=s.adminId&&s.players&&s.players[s.adminId];
            if(!adminPresent){
                const sorted=allPlayers.map(id=>({id,joinTime:(s.players[id]||{}).joinTime||0})).sort((a,b)=>a.joinTime-b.joinTime);
                if(sorted.length>0&&sorted[0].id===this.playerId){update(this.roomRef,{adminId:this.playerId});return;}
            }
            // BUG 2 FIX — admin re-entered their own room as sole player with gameStarted:true.
            // Auto-reset to team selection so no stale modal state bleeds through.
            if(s.gameStarted&&s.adminId===this.playerId&&allPlayers.length<=1){
                const noTeams=!s.teams||s.teams.every(t=>t.playerCount===0);
                if(noTeams){
                    const r={gameStarted:false,turnStatus:'transitioning',turnStartTime:null,
                        describerId:null,lastDescriberId:null,currentTeamIndex:0,usedCardIndices:[]};
                    s.teams.forEach((_,i)=>{r[`teams/${i}/score`]=0;});
                    update(this.roomRef,r);return;
                }
            }
            // Skip empty team
            if(s.turnStatus==='transitioning'&&s.teams){
                const cur=s.teams[s.currentTeamIndex];
                if(cur&&cur.playerCount===0){
                    for(let i=1;i<s.teams.length;i++){const idx=(s.currentTeamIndex+i)%s.teams.length;if(s.teams[idx].playerCount>0){update(this.roomRef,{currentTeamIndex:idx});return;}}
                }
            }
            this.events.onStateUpdate(s);
        });
    }
    async startTurn(){await update(this.roomRef,{turnStatus:'active',turnStartTime:Date.now(),describerId:this.playerId});}
    async endTurn(){
        const s=this.currentState; if(!s||s.turnStatus!=='active')return;
        let next=s.currentTeamIndex;
        for(let i=1;i<=s.teams.length;i++){const idx=(s.currentTeamIndex+i)%s.teams.length;if(s.teams[idx].players&&Object.keys(s.teams[idx].players).length>0){next=idx;break;}}
        await update(this.roomRef,{turnStatus:'ended',lastDescriberId:s.describerId});
        endTurnTimeout=setTimeout(async()=>{endTurnTimeout=null;if(!turnManager)return;await update(this.roomRef,{currentTeamIndex:next,turnStatus:'transitioning',turnStartTime:null,describerId:null});},3000);
    }
    async drawCard(isCorrect){
        const s=this.currentState;
        if(!s||s.turnStatus!=='active'||s.describerId!==this.playerId||isProcessingCard)return;
        // BUG 3 FIX — block skip on last card
        if(!isCorrect&&(s.deck||[]).length<=1){
            uiLastCardError.textContent=i18n[lang].lastCardError;
            uiLastCardError.classList.remove('hidden');
            uiLastCardError.style.animation='none'; void uiLastCardError.offsetWidth; uiLastCardError.style.animation='';
            if(lastCardErrorTimeout)clearTimeout(lastCardErrorTimeout);
            lastCardErrorTimeout=setTimeout(()=>{uiLastCardError.classList.add('hidden');lastCardErrorTimeout=null;},2500);
            return;
        }
        isProcessingCard=true;
        try{
            let deck=[...(s.deck||[])]; const cur=deck.shift();
            if(!isCorrect)deck.push(cur);
            const empty=deck.length===0;
            if(empty){
                const used=new Set(s.usedCardIndices||[]); if(isCorrect)used.add(cur);
                let pool=Array.from({length:DECK_SIZE},(_,i)=>i).filter(i=>!used.has(i));
                if(!pool.length){pool=Array.from({length:DECK_SIZE},(_,i)=>i);used.clear();}
                deck=shuffleArray(pool);
            }
            const upd={};
            if(isCorrect){
                upd[`teams/${s.currentTeamIndex}/score`]=(s.teams[s.currentTeamIndex].score||0)+1;
                const used=[...(s.usedCardIndices||[])]; if(!used.includes(cur))used.push(cur); upd.usedCardIndices=used;
            } else {
                // BUG 5 FIX — deduct 1 point on skip, floor 0
                upd[`teams/${s.currentTeamIndex}/score`]=Math.max(0,(s.teams[s.currentTeamIndex].score||0)-1);
            }
            if(empty){
                upd.turnStatus='shuffling'; upd.timeLeft=Math.max(0,s.turnDuration-Math.floor((Date.now()-s.turnStartTime)/1000));
                upd.deck=deck; upd.currentCardIndex=deck[0];
                if(!upd.usedCardIndices)upd.usedCardIndices=s.usedCardIndices||[];
            } else { upd.deck=deck; upd.currentCardIndex=deck[0]; }
            await update(this.roomRef,upd);
        } finally{isProcessingCard=false;}
    }
}
 
window.enterRoom=async function(){
    const raw=document.getElementById('room-input').value.trim();
    const err=document.getElementById('room-input-error');
    if(!raw){err.textContent=lang==='he'?"אנא הכנס שם חדר!":"Please enter a room name!";err.style.display='block';return;}
    if(hasInvalidChars(raw)){err.textContent=i18n[lang].roomInvalidChars;err.style.display='block';return;}
    err.style.display='none';
    uiLobby.style.display='none';
    document.getElementById('shared-board').style.display='block';
    document.getElementById('personal-area').style.display='flex';
    myJoinTime=Date.now();
    adminDifficultyChosen=false; pendingDifficulty='medium';
    turnManager=new GameTurnManager(ref(db,'rooms/'+raw),myPlayerId);
    await turnManager.connect(); await turnManager.registerPresence();
    turnManager.events.onStateUpdate=renderState; turnManager.listenToState();
};
 
window.goToLobby=function(){
    if(endTurnTimeout){clearTimeout(endTurnTimeout);endTurnTimeout=null;}
    if(localTimerInterval){clearInterval(localTimerInterval);localTimerInterval=null;}
    if(window._shufflingTimeout){clearTimeout(window._shufflingTimeout);window._shufflingTimeout=null;}
    if(lastCardErrorTimeout){clearTimeout(lastCardErrorTimeout);lastCardErrorTimeout=null;}
    if(turnManager){
        const rid=turnManager.roomRef.key;
        const pr=ref(db,`rooms/${rid}/players/${myPlayerId}`); onDisconnect(pr).cancel(); remove(pr);
        if(myTeamId){const ti=(turnManager.currentState?.teams||[]).findIndex(t=>t.id===myTeamId);if(ti>=0){const tr=ref(db,`rooms/${rid}/teams/${ti}/players/${myPlayerId}`);onDisconnect(tr).cancel();remove(tr);}}
        turnManager.events.onStateUpdate=()=>{};
        if(turnManager._unsub){turnManager._unsub();turnManager._unsub=null;}
        turnManager=null;
    }
    myTeamId=null;myPlayerNumber=null;isEditMode=false;lastDisplayedCardIndex=-1;isProcessingCard=false;
    adminDifficultyChosen=false;pendingDifficulty='medium';
    uiLobby.style.display='flex';
    document.getElementById('shared-board').style.display='none';
    document.getElementById('personal-area').style.display='none';
    uiModal.classList.add('hidden');
    document.getElementById('winner-modal').classList.add('hidden');
    document.getElementById('shuffling-ui').classList.add('hidden');
    uiCardContainer.classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    uiRoleMessage.classList.add('hidden');
    uiBtnStartTurn.classList.add('hidden');
    uiLastCardError.classList.add('hidden');
    updatePlayerInfoDisplay();
    uiPlayersCount.textContent=i18n[lang].waitingPlayers;
    uiTimer.textContent='01:00';
    uiStatus.textContent=i18n[lang].waitingPlayers;
};
 
window.selectTeam=async function(teamId){
    if(!turnManager?.currentState||myTeamId===teamId)return;
    const s=turnManager.currentState,rid=turnManager.roomRef.key;
    for(let i=0;i<s.teams.length;i++){if(s.teams[i].players?.[myPlayerId]){const r=ref(db,`rooms/${rid}/teams/${i}/players/${myPlayerId}`);onDisconnect(r).cancel();await remove(r);}}
    const ti=s.teams.findIndex(t=>t.id===teamId);
    const nums=Object.values(s.teams[ti].players||{}).map(p=>p.num||0);
    const pNum=nums.length?Math.max(...nums)+1:1;
    const pr=ref(db,`rooms/${rid}/teams/${ti}/players/${myPlayerId}`);
    onDisconnect(pr).remove(); await set(pr,{num:pNum,active:true,joinTime:Date.now()});
    myTeamId=teamId;myPlayerNumber=pNum;
    updatePlayerInfoDisplay();highlightSelectedTeamBtn();renderState(turnManager.currentState);
};

window.setDifficulty=function(level){
    if(!turnManager?.currentState||turnManager.currentState.adminId!==myPlayerId)return;
    adminDifficultyChosen=true;pendingDifficulty=level;updateDifficultyUI(level); // BUG 1 FIX
};
 
function updateDifficultyUI(level){
    const isAdmin=turnManager?.currentState?.adminId===myPlayerId;
    document.querySelectorAll('.diff-btn').forEach(b=>{b.style.backgroundColor='#f9f9f9';b.style.borderColor='#ddd';b.style.color='#666';b.style.opacity=isAdmin?'1':'0.6';b.style.cursor=isAdmin?'pointer':'not-allowed';});
    const map={easy:{el:'diff-easy',bg:'#d5f5e3',border:'#2ecc71',color:'#27ae60'},medium:{el:'diff-medium',bg:'#fcf3cf',border:'#f1c40f',color:'#f39c12'},hard:{el:'diff-hard',bg:'#fadbd8',border:'#e74c3c',color:'#c0392b'}};
    if(map[level]){const b=document.getElementById(map[level].el);b.style.backgroundColor=map[level].bg;b.style.borderColor=map[level].border;b.style.color=map[level].color;}
}
 
window.startGame=function(){
    if(!myTeamId){alert(lang==='he'?"אנא בחר קבוצה קודם!":"Please select a team first!");return;}
    // BUG 1 FIX — use stored difficulty unless admin explicitly changed it
    const diff=adminDifficultyChosen?pendingDifficulty:(turnManager.currentState.difficulty||'medium');
    update(turnManager.roomRef,{gameStarted:true,difficulty:diff});
};
 
window.resumePlay=async function(){
    if(!turnManager?.currentState)return;
    const s=turnManager.currentState; if(s.describerId!==myPlayerId)return;
    await update(turnManager.roomRef,{turnStatus:'active',turnStartTime:Date.now()-((s.turnDuration-(s.timeLeft||0))*1000),timeLeft:null});
};

window.confirmSettings=async function(){
    if(turnManager.currentState.adminId!==myPlayerId)return;
    isEditMode=false;uiModal.classList.add('hidden');
    const deck=freshDeck(),s=turnManager.currentState;
    let first=0;for(let i=0;i<s.teams.length;i++){if(s.teams[i].playerCount>0){first=i;break;}}
    const upd={difficulty:pendingDifficulty,deck,currentCardIndex:deck[0],turnStatus:'transitioning',turnStartTime:null,describerId:null,lastDescriberId:null,currentTeamIndex:first,gameStarted:true,usedCardIndices:[]};
    s.teams.forEach((_,i)=>{upd[`teams/${i}/score`]=0;});
    await update(turnManager.roomRef,upd);
};
 
window.restartToTeamSelection=async function(){
    if(turnManager.currentState.adminId!==myPlayerId)return;
    isEditMode=false;uiModal.classList.add('hidden');document.getElementById('winner-modal').classList.add('hidden');
    const s=turnManager.currentState;
    const upd={gameStarted:false,turnStatus:'transitioning',turnStartTime:null,describerId:null,lastDescriberId:null,currentTeamIndex:0,usedCardIndices:[]};
    s.teams.forEach((_,i)=>{upd[`teams/${i}/score`]=0;});
    await update(turnManager.roomRef,upd);
};
 
window.endGameAndReset=async function(){
    if(turnManager.currentState.adminId!==myPlayerId)return;
    await update(turnManager.roomRef,{resetTimestamp:Date.now()});
    goToLobby();
};
 
function updatePlayerInfoDisplay(){
    if(myTeamId&&myPlayerNumber){
        const d=i18n[lang],isAdmin=turnManager?.currentState?.adminId===myPlayerId;
        const crown=isAdmin?`<div style="color:#d4af37;font-size:13px;font-weight:900;margin-top:3px;">👑 ${d.roomAdmin}</div>`:'';
        uiPlayerInfoDisplay.innerHTML=`${d.teamPrefix}${d.teamNames[myTeamId]}${d.teamSuffix} | ${d.playerWord}: ${myPlayerNumber}${crown}`;
        uiPlayerInfoDisplay.style.backgroundColor=teamBgColors[myTeamId];
        uiPlayerInfoDisplay.style.color=teamColors[myTeamId];
        uiCardContainer.style.backgroundColor=teamBgColors[myTeamId];
    } else {
        uiPlayerInfoDisplay.innerHTML='';uiPlayerInfoDisplay.style.backgroundColor='transparent';uiCardContainer.style.backgroundColor='white';
    }
}
 
function updateBoardColors(teams){
    for(let i=0;i<=MAX_STEPS;i++){const sq=document.getElementById('sq-'+i);if(sq)sq.style.background='';}
    const map={};
    teams.forEach(t=>{if(t.playerCount>0){const p=Math.min(t.score||0,MAX_STEPS);if(!map[p])map[p]=[];map[p].push(teamBgColors[t.id]);}});
    for(const pos in map){
        const sq=document.getElementById('sq-'+pos);if(!sq)continue;const c=map[pos];
        if(c.length===1){sq.style.background=c[0];}
        else{const dir=lang==='he'?'to right':'to left',step=100/c.length;sq.style.background=`linear-gradient(${dir},${c.map((x,i)=>`${x} ${i*step}%,${x} ${(i+1)*step}%`).join(',')})`;}
    }
}
 
let fadeTimeout;
function loadCardIfNeeded(index,diff){
    if(index===lastDisplayedCardIndex)return; lastDisplayedCardIndex=index;
    const cards=i18n[lang].cards,card=(index>=0&&index<cards.length)?cards[index]:null; if(!card)return;
    uiCardContainer.classList.add('fade-out'); clearTimeout(fadeTimeout);
    fadeTimeout=setTimeout(()=>{
        document.getElementById('main-word').textContent=card.word;
        document.getElementById('card-icon').textContent=card.icon||'🖼️';
        let lim=4;if(diff==='easy')lim=2;if(diff==='hard')lim=6;
        const ul=document.getElementById('taboo-words');ul.innerHTML='';
        card.taboo.slice(0,lim).forEach(w=>{const li=document.createElement('li');li.textContent=w;ul.appendChild(li);});
        uiCardContainer.classList.remove('fade-out');
    },300);
}
 
function renderState(state){
    const d=i18n[lang],isAdmin=state.adminId===myPlayerId;
    updatePlayerInfoDisplay(); highlightSelectedTeamBtn();
 
    // ── Modal ────────────────────────────────────────────────────────────────
    if(!isEditMode){
        if(!state.gameStarted){
            uiModal.classList.remove('hidden');
            document.getElementById('winner-modal').classList.add('hidden');
            document.getElementById('team-selection-group').classList.remove('hidden');
            if(isAdmin){
                document.getElementById('difficulty-group').classList.remove('hidden');
                document.getElementById('admin-setup-controls').classList.remove('hidden');
                document.getElementById('admin-edit-controls').classList.add('hidden');
                document.getElementById('non-admin-msg').classList.add('hidden');
                document.getElementById('non-admin-note').classList.add('hidden');
                // BUG 1 FIX — only load from Firebase if admin hasn't manually picked yet
                if(!adminDifficultyChosen){pendingDifficulty=state.difficulty||'medium';updateDifficultyUI(pendingDifficulty);}
            } else {
                document.getElementById('difficulty-group').classList.add('hidden');
                document.getElementById('admin-setup-controls').classList.add('hidden');
                document.getElementById('admin-edit-controls').classList.add('hidden');
                document.getElementById('non-admin-msg').classList.remove('hidden');
                document.getElementById('non-admin-note').classList.add('hidden');
            }
        } else if(!myTeamId){
            // Game active but player hasn't picked a team — show only team picker, no other modal content
            uiModal.classList.remove('hidden');
            document.getElementById('team-selection-group').classList.remove('hidden');
            document.getElementById('difficulty-group').classList.add('hidden');
            document.getElementById('admin-setup-controls').classList.add('hidden');
            document.getElementById('admin-edit-controls').classList.add('hidden');
            document.getElementById('non-admin-msg').classList.add('hidden');
            document.getElementById('non-admin-note').classList.add('hidden');
        } else {
            uiModal.classList.add('hidden');
        }
    }
 
    document.getElementById('btn-settings').classList.toggle('hidden',!state.gameStarted);
    updateBoardColors(state.teams);
    const pt=state.teams.filter(t=>t.playerCount>0).map(t=>`${d.teamNames[t.id]}: ${t.playerCount}`);
    uiPlayersCount.textContent=pt.length?`${d.playersConnected} - ${pt.join(' | ')}`:d.waitingChoose;
 
    // Winner
    const winner=state.teams.find(t=>(t.score||0)>=MAX_STEPS&&t.playerCount>0);
    if(winner){
        if(localTimerInterval){clearInterval(localTimerInterval);localTimerInterval=null;}
        uiCardContainer.classList.add('hidden');document.getElementById('controls').classList.add('hidden');
        uiRoleMessage.classList.add('hidden');uiBtnStartTurn.classList.add('hidden');document.getElementById('shuffling-ui').classList.add('hidden');
        document.getElementById('winner-modal').classList.remove('hidden');
        const wt=document.getElementById('winner-title');
        wt.textContent=`${d.winnerPrefix}${d.teamNames[winner.id]}${d.winnerSuffix}`;wt.style.color=teamColors[winner.id];
        document.getElementById('winner-admin-controls').classList.toggle('hidden',!isAdmin);
        document.getElementById('winner-non-admin-msg').classList.toggle('hidden',isAdmin);
        return;
    } else {document.getElementById('winner-modal').classList.add('hidden');}
 
    if(!state.gameStarted||!myTeamId)return;
    const ct=state.teams[state.currentTeamIndex]; if(!ct)return;
 
    // Shuffling
    if(state.turnStatus==='shuffling'){
        if(localTimerInterval){clearInterval(localTimerInterval);localTimerInterval=null;}
        uiTimer.textContent=formatTime(state.timeLeft||0);
        uiCardContainer.classList.add('hidden');document.getElementById('controls').classList.add('hidden');
        uiRoleMessage.classList.add('hidden');uiBtnStartTurn.classList.add('hidden');
        document.getElementById('shuffling-ui').classList.remove('hidden');
        const isDesc=state.describerId===myPlayerId;
        document.getElementById('shuffling-loader').classList.remove('hidden');
        document.getElementById('btn-resume-play').classList.add('hidden');
        if(isDesc&&!window._shufflingTimeout){
            window._shufflingTimeout=setTimeout(()=>{
                window._shufflingTimeout=null;
                if(turnManager?.currentState?.describerId===myPlayerId&&turnManager?.currentState?.turnStatus==='shuffling'){
                    document.getElementById('shuffling-loader').classList.add('hidden');
                    document.getElementById('btn-resume-play').classList.remove('hidden');
                }
            },5000);
        }
        return;
    } else {
        document.getElementById('shuffling-ui').classList.add('hidden');
        if(window._shufflingTimeout){clearTimeout(window._shufflingTimeout);window._shufflingTimeout=null;}
    }
 
    // Timer
    if(state.turnStatus==='active'){
        if(!localTimerInterval){
            localTimerInterval=setInterval(()=>{
                const c=turnManager?.currentState;
                if(!c||c.turnStatus!=='active'){clearInterval(localTimerInterval);localTimerInterval=null;return;}
                const tl=Math.max(0,c.turnDuration-Math.floor((Date.now()-c.turnStartTime)/1000));
                uiTimer.textContent=formatTime(tl);
                if(tl<=0&&c.describerId===myPlayerId)turnManager.endTurn();
            },250);
        }
    } else {if(localTimerInterval){clearInterval(localTimerInterval);localTimerInterval=null;}uiTimer.textContent=formatTime(state.turnDuration);}
 
    // Active turn
    if(state.turnStatus==='active'){
        uiBtnStartTurn.classList.add('hidden');
        uiStatus.style.fontSize='16px';uiStatus.textContent=`${d.playingNow}${d.teamNames[ct.id]}${d.teamSuffix}!`;uiStatus.style.color=teamColors[ct.id];
        if(myTeamId!==ct.id){
            // BUG 4 FIX — inspector card only when active team has 2+ players
            if(ct.playerCount>=2){
                uiRoleMessage.classList.add('hidden');uiCardContainer.classList.remove('hidden');
                document.getElementById('controls').classList.add('hidden');
                uiCardRoleTitle.textContent=d.roleInspector;loadCardIfNeeded(state.currentCardIndex,state.difficulty);
            } else {
                uiCardContainer.classList.add('hidden');document.getElementById('controls').classList.add('hidden');
                uiRoleMessage.classList.remove('hidden');uiRoleMessage.textContent=`${d.turnOf}${d.teamNames[ct.id]}${d.teamSuffix}!`;
            }
        } else if(state.describerId===myPlayerId){
            uiRoleMessage.classList.add('hidden');uiCardContainer.classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            uiCardRoleTitle.textContent=d.roleDescriber;loadCardIfNeeded(state.currentCardIndex,state.difficulty);
        } else {
            uiCardContainer.classList.add('hidden');document.getElementById('controls').classList.add('hidden');
            uiRoleMessage.classList.remove('hidden');uiRoleMessage.textContent=d.roleGuesser;
        }
        return;
    }
 
    // Between turns
    uiCardContainer.classList.add('hidden');document.getElementById('controls').classList.add('hidden');
    uiRoleMessage.classList.add('hidden');lastDisplayedCardIndex=-1;
    if(state.turnStatus==='ended'){
        uiStatus.textContent=d.timeUp;uiStatus.style.fontSize='18px';uiStatus.style.color='#e74c3c';uiBtnStartTurn.classList.add('hidden');
    } else {
        uiStatus.style.fontSize='20px';uiStatus.style.color=teamColors[ct.id]||'#333';
        uiStatus.textContent=`${d.turnOf}${d.teamNames[ct.id]}${d.teamSuffix}!`;
        if(myTeamId===ct.id){
            const canStart=!(ct.playerCount>1&&state.lastDescriberId===myPlayerId);
            if(canStart){uiBtnStartTurn.classList.remove('hidden');}else{uiBtnStartTurn.classList.add('hidden');uiStatus.textContent=d.waitTeammate;}
        } else {uiBtnStartTurn.classList.add('hidden');}
    }
}
 
uiBtnStartTurn.addEventListener('click',()=>{if(turnManager)turnManager.startTurn();});
document.getElementById('btn-correct').addEventListener('click',()=>{if(turnManager)turnManager.drawCard(true);});
document.getElementById('btn-skip').addEventListener('click',()=>{if(turnManager)turnManager.drawCard(false);});
document.getElementById('room-input').addEventListener('keydown',e=>{if(e.key==='Enter')enterRoom();});
 
updateStaticText();
</script>
</body>
</html>
