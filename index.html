<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talio-board</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            color: #4a4a4a;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh;
            overflow-y: auto; overflow-x: hidden;
            touch-action: manipulation;
        }
        .lang-toggle-container {
            position: absolute; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 8px;
            z-index: 150; font-weight: bold; font-size: 14px;
        }
        [dir="ltr"] .lang-toggle-container { right: auto; left: 20px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #3498DB; }
        input:checked + .slider:before { transform: translateX(20px); }
        .lang-label { color: #aaa; transition: 0.3s; }
        .lang-active { color: #3498DB; font-weight: 900; }

        #lobby {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(253, 251, 247, 0.98);
            display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; padding-top: 20px; z-index: 100;
        }
        #lobby h1, #lobby h3 { margin-top: 0; }
        .room-input {
            width: 80%; max-width: 300px; padding: 15px; font-size: 20px;
            margin-top: 10px; margin-bottom: 25px; border: 2px solid #dcd5c6;
            border-radius: 12px; text-align: center; background-color: #fff; color: #333;
        }
        .btn-join-room {
            background-color: #3498DB; color: white; padding: 15px 30px; font-size: 22px;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 0 #2980B9; transition: transform 0.1s;
        }
        .btn-join-room:active { transform: translateY(4px); box-shadow: none; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content {
            background-color: #fff; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .settings-group { margin-bottom: 20px; }
        .settings-group h4 { margin: 0 0 10px 0; color: #555; font-size: 18px; }
        .diff-buttons { display: flex; gap: 8px; justify-content: center; }
        .diff-btn {
            flex: 1; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 10px;
            border: 2px solid #ddd; cursor: pointer; background-color: #f9f9f9; color: #666; transition: all 0.2s;
        }
        #modal-team-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .team-btn {
            padding: 12px 15px; font-size: 16px; border-radius: 10px;
            border: 3px solid transparent; cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        .team-btn.blue   { background-color: #D6EAF8; color: #2874A6; }
        .team-btn.red    { background-color: #FADBD8; color: #943126; }
        .team-btn.purple { background-color: #E8DAEF; color: #6C3483; }
        .team-btn.green  { background-color: #D5F5E3; color: #1E8449; }
        .team-btn.yellow { background-color: #FCF3CF; color: #B7950B; }

        #shared-board {
            background-color: #f4f1ea; padding: 15px 10px; text-align: center;
            border-bottom: 3px solid #e0dcd3; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10;
        }
        .game-title {
            font-size: 26px; font-weight: 900; color: #f39c12; letter-spacing: 1px;
            margin-bottom: 5px; flex: 1; text-align: right;
        }
        [dir="ltr"] .game-title { text-align: left; }
        .board-grid {
            display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
            margin: 10px auto; max-width: 600px; padding: 10px;
            background-color: #ffffff; border-radius: 12px; border: 2px solid #e0dcd3;
        }
        .square {
            width: 35px; height: 35px; background-color: #faf9f5;
            border: 1px solid #ece8e0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #aaa; font-weight: bold;
        }
        .square.finish { border: 2px solid #f39c12; color: #f39c12; background-color: #fef9e7; }
        .top-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; padding: 0 10px; }
        #timer { font-size: 40px; font-weight: bold; color: #e74c3c; margin-top: 5px; }

        #personal-area {
            padding: 20px 10px 40px 10px; flex: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        .card {
            background-color: white; color: #333; width: 90%; max-width: 350px; border-radius: 20px;
            padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 20px; margin-top: 10px; border: 1px solid #f0f0f0;
            transition: opacity 0.3s ease, background-color 0.4s ease;
        }
        .fade-out { opacity: 0 !important; }
        #card-role-title {
            font-size: 18px; font-weight: bold; color: #444; margin-bottom: 15px;
            background-color: rgba(255,255,255,0.7); padding: 8px; border-radius: 8px; border: 1px dashed #ccc;
        }
        .main-word-container {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            margin-bottom: 10px; border-bottom: 2px dashed rgba(0,0,0,0.1); padding-bottom: 10px;
        }
        .main-word { font-size: 32px; font-weight: 900; color: #2c3e50; }
        .card-icon  { font-size: 40px; }
        .taboo-list { list-style: none; padding: 0; margin: 0; font-size: 20px; color: #c0392b; font-weight: bold; }
        .taboo-list li { margin: 8px 0; }
        .controls { display: flex; width: 95%; max-width: 400px; gap: 15px; }
        button.action-btn {
            flex: 1; padding: 18px 10px; font-size: 20px; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer; color: #333;
        }
        .btn-correct { background-color: #A9DFBF; box-shadow: 0 4px 0 #7DCEA0; }
        .btn-skip    { background-color: #F5B7B1; box-shadow: 0 4px 0 #F1948A; }
        .btn-start {
            background-color: #A9DFBF; color: #1E8449; width: 90%; max-width: 350px; margin-top: 20px;
            box-shadow: 0 4px 0 #7DCEA0; border: none; padding: 18px; font-size: 22px; font-weight: bold;
            border-radius: 12px; cursor: pointer; transition: all 0.1s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }
        .hidden { display: none !important; }
        .message-box {
            background-color: #e8f8f5; color: #117a65; padding: 15px; border-radius: 10px;
            text-align: center; font-size: 18px; font-weight: bold;
            width: 90%; max-width: 350px; margin-top: 20px; border: 1px solid #d1f2eb;
        }
        .players-count { font-size: 14px; color: #7f8c8d; margin-bottom: 10px; font-weight: bold; }
        .loader {
            border: 5px solid #f3f3f3; border-top: 5px solid #3498db;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 400px) {
            .square { width: 28px; height: 28px; font-size: 10px; border-radius: 6px; }
            .btn-start { font-size: 18px; }
        }
    </style>
</head>
<body>

<div id="lobby">
    <div class="lang-toggle-container">
        <span id="lbl-he" class="lang-label lang-active">HE</span>
        <label class="switch">
            <input type="checkbox" id="lang-toggle-btn" onchange="toggleLanguage()">
            <span class="slider"></span>
        </label>
        <span id="lbl-en" class="lang-label">EN</span>
    </div>
    <h1 class="game-title" style="font-size:42px;margin-top:50px;margin-bottom:10px;text-align:center;width:100%;">TALIO-BOARD</h1>
    <h3 id="txt-enter-room" style="margin-bottom:20px;color:#777;">הכנס שם חדר להתחלה:</h3>
    <input type="text" id="room-input" class="room-input" placeholder="שם החדר (למשל: משפחת כהן)">
    <p id="room-input-error" style="color:#e74c3c;font-size:13px;margin:0 0 10px 0;display:none;"></p>
    <button id="btn-join" class="btn-join-room" onclick="enterRoom()">היכנס לחדר</button>
</div>

<!-- Setup / Settings Modal -->
<div id="setup-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="modal-title">הגדרות חדר</h2>
        <div id="non-admin-note" class="hidden" style="color:#e74c3c;font-weight:bold;font-size:14px;margin-bottom:15px;"></div>

        <div class="settings-group" id="difficulty-group">
            <h4 id="txt-difficulty">רמת קושי</h4>
            <div class="diff-buttons">
                <button class="diff-btn" id="diff-easy"   onclick="setDifficulty('easy')">קל</button>
                <button class="diff-btn" id="diff-medium" onclick="setDifficulty('medium')">בינוני</button>
                <button class="diff-btn" id="diff-hard"   onclick="setDifficulty('hard')">קשה</button>
            </div>
        </div>

        <div class="settings-group" id="team-selection-group">
            <h4 id="txt-select-team">בחירת קבוצה</h4>
            <div id="modal-team-buttons">
                <button class="team-btn blue"   id="team-blue"   onclick="selectTeam('blue')">תכלת</button>
                <button class="team-btn red"    id="team-red"    onclick="selectTeam('red')">ורודה</button>
                <button class="team-btn purple" id="team-purple" onclick="selectTeam('purple')">סגולה</button>
                <button class="team-btn green"  id="team-green"  onclick="selectTeam('green')">ירוקה</button>
                <button class="team-btn yellow" id="team-yellow" onclick="selectTeam('yellow')">צהובה</button>
            </div>
        </div>

        <!-- First-time admin (before game starts) -->
        <div id="admin-setup-controls" class="hidden">
            <button id="btn-modal-start" class="btn-start" style="width:100%;margin-top:10px;" onclick="startGame()">התחל משחק</button>
        </div>

        <!-- In-game settings (gear icon) -->
        <div id="admin-edit-controls" class="hidden">
            <button id="btn-change-teams"
                style="width:100%;margin-bottom:15px;padding:12px;border-radius:12px;border:2px solid #e67e22;background:#fdf2e9;color:#d35400;font-weight:bold;cursor:pointer;"
                onclick="restartToTeamSelection()">החלפת קבוצות (התחל מחדש)</button>
            <button id="btn-end-game"
                style="width:100%;margin-bottom:15px;padding:12px;border-radius:12px;border:2px solid #c0392b;background:#fadbd8;color:#900;font-weight:bold;cursor:pointer;"
                onclick="endGameAndReset()">סיים משחק (מחק חדר)</button>
            <p id="edit-warning" style="color:#e74c3c;font-size:14px;font-weight:bold;margin-bottom:15px;">שינוי הגדרות יתחיל את המשחק מחדש</p>
            <div style="display:flex;gap:10px;">
                <button id="btn-modal-confirm" class="btn-start" style="flex:1;margin-top:0;" onclick="confirmSettings()">אישור</button>
                <button id="btn-modal-cancel"
                    style="flex:1;padding:18px;border-radius:12px;border:2px solid #ccc;background:#eee;font-weight:bold;cursor:pointer;"
                    onclick="closeModal()">ביטול</button>
            </div>
        </div>

        <!-- Non-admin waiting message (before game starts) -->
        <div id="non-admin-msg" class="hidden" style="margin-top:20px;color:#777;font-weight:bold;font-size:16px;">
            ממתין למנהל החדר שיתחיל את המשחק...
        </div>
    </div>
</div>

<!-- Winner Modal -->
<div id="winner-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h1 id="winner-title" style="font-size:30px;margin-top:0;margin-bottom:10px;"></h1>
        <div id="winner-admin-controls" class="hidden">
            <button id="btn-restart-game" class="btn-start" onclick="restartToTeamSelection()" style="width:100%;margin-top:20px;">התחל מחדש</button>
        </div>
        <div id="winner-non-admin-msg" class="hidden" style="margin-top:20px;color:#777;font-weight:bold;font-size:16px;">
            ממתין למנהל החדר שיתחיל מחדש...
        </div>
    </div>
</div>

<!-- Main board -->
<div id="shared-board">
    <div class="top-info">
        <div style="display:flex;gap:10px;align-items:flex-start;flex:2;">
            <button id="btn-settings" class="hidden"
                style="font-size:24px;background:none;border:none;cursor:pointer;padding:0;"
                onclick="openSettings()">⚙️</button>
            <div style="display:flex;flex-direction:column;align-items:flex-start;">
                <div id="player-info-display"
                    style="font-size:14px;font-weight:bold;padding:5px 10px;border-radius:8px;transition:all 0.3s;"></div>
            </div>
        </div>
        <div class="game-title">TALIO</div>
    </div>
    <div id="players-count" class="players-count">ממתין לשחקנים...</div>
    <div class="board-grid" id="board-grid"></div>
    <div id="timer">01:00</div>
    <div id="status" style="margin-top:5px;color:#888;font-weight:bold;transition:font-size 0.3s;">ממתין לשחקנים...</div>
</div>

<div id="personal-area">
    <button id="btn-start-turn" class="btn-start hidden">התחל תור</button>
    <div id="role-message" class="message-box hidden"></div>

    <div id="shuffling-ui" class="message-box hidden"
        style="background-color:#fff3cd;color:#856404;border-color:#ffeeba;">
        <h3 id="txt-shuffling" style="margin-top:0;">מערבב חפיסה מחדש...</h3>
        <div class="loader" id="shuffling-loader"></div>
        <button id="btn-resume-play" class="btn-start hidden" onclick="resumePlay()"
            style="width:100%;margin-top:10px;">חזור לשחק</button>
    </div>

    <div id="card-container" class="card hidden">
        <div id="card-role-title"></div>
        <div class="main-word-container">
            <span id="card-icon" class="card-icon">🖼️</span>
            <span class="main-word" id="main-word">מילה</span>
        </div>
        <ul class="taboo-list" id="taboo-words"></ul>
    </div>

    <div id="controls" class="controls hidden">
        <button id="btn-skip"    class="action-btn btn-skip">פס / דילוג</button>
        <button id="btn-correct" class="action-btn btn-correct">הצליחו!</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {
    getDatabase, ref, set, onValue, update, get, remove, onDisconnect, runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

// ─── Firebase config ──────────────────────────────────────────────────────────
const firebaseConfig = {
    apiKey:      "AIzaSyDiGUmCG08Ke6JYYR_gW6r-JMwdxt0aJDk",
    authDomain:  "talio-board.firebaseapp.com",
    databaseURL: "https://talio-board-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:   "talio-board"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ─── i18n ─────────────────────────────────────────────────────────────────────
let lang = 'he';

const CARDS_HE = [
    {word:"כלב",     icon:"🐶", taboo:["חיה","נבחן","חתול","עצם","רצועה","זנב"]},
    {word:"שמש",     icon:"☀️", taboo:["יום","אור","חם","שמיים","צהוב","כוכב"]},
    {word:"אופניים", icon:"🚲", taboo:["גלגלים","לרכוב","פדלים","קסדה","כביש","כידון"]},
    {word:"פיצה",    icon:"🍕", taboo:["איטליה","גבינה","אוכל","משלוח","משולש","בצק"]},

    {word:"קפה",     icon:"☕", taboo:["בוקר","לשתות","חלב","ספל","הפוך","קפאין"]},
    {word:"מיטה",    icon:"🛏️", taboo:["לישון","שמיכה","כרית","לילה","מזרן","חלום"]},

    {word:"גיטרה",   icon:"🎸", taboo:["לנגן","מיתרים","כלי","מוזיקה","חשמלית","מפרט"]},
    {word:"רופא",    icon:"👨‍⚕️", taboo:["חולה","בית חולים","תרופה","מרפאה","בריאות","סטטוסקופ"]},
    {word:"שוקולד",  icon:"🍫", taboo:["מתוק","קקאו","חום","פרה","טעים","חפיסה"]},
    {word:"שעון",    icon:"⌚", taboo:["זמן","מחוגים","יד","שעה","לענוד","מעורר"]},

const CARDS_EN = [
    {word:"Dog",       icon:"🐶", taboo:["Animal","Bark","Cat","Bone","Leash","Tail"]},
    {word:"Sun",       icon:"☀️", taboo:["Day","Light","Hot","Sky","Yellow","Star"]},

    {word:"Train",     icon:"🚆", taboo:["Tracks","Station","Carriage","Ticket","Travel","Engine"]},
    {word:"Teacher",   icon:"👩‍🏫", taboo:["School","Students","Class","Board","Teach","Test"]},

// Both decks must have the same length — this is enforced here once
console.assert(CARDS_HE.length === CARDS_EN.length, "Card decks must be the same length!");
const DECK_SIZE = CARDS_HE.length;

const i18n = {
    he: {
        enterRoom:"הכנס שם חדר להתחלה:", roomPlaceholder:"שם החדר (למשל: משפחת כהן)", joinBtn:"היכנס לחדר",

// ─── Helpers ──────────────────────────────────────────────────────────────────

function shuffleArray(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function freshDeck() {
    // Returns a shuffled array of all card indices
    return shuffleArray(Array.from({ length: DECK_SIZE }, (_, i) => i));
}

function formatTime(seconds) {
    const s = Math.max(0, Math.floor(seconds));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m < 10 ? '0'+m : m}:${r < 10 ? '0'+r : r}`;
}

// FIX #12 — sanitize room name: Firebase paths cannot contain . # $ [ ] /
function sanitizeRoomId(raw) {
    return raw.replace(/[.#$[\]/]/g, '_');
}

function hasInvalidChars(name) {
    return /[.#$[\]/]/.test(name);
}

// ─── GameTurnManager ──────────────────────────────────────────────────────────
class GameTurnManager {
    constructor(roomRef, playerId) {
        this.roomRef      = roomRef;
        this.playerId     = playerId;
        this.currentState = null;
        this.events       = { onStateUpdate: () => {} };
    }

    _buildInitialState() {
        const deck = freshDeck();
        return {
            adminId:          this.playerId,
            gameStarted:      false,
            difficulty:       'medium',
            teams: [
                { id:'blue',   players:{}, score:0 },
                { id:'red',    players:{}, score:0 },
                { id:'purple', players:{}, score:0 },
                { id:'green',  players:{}, score:0 },
                { id:'yellow', players:{}, score:0 }
            ],
            currentTeamIndex: 0,
            turnStatus:       'transitioning',
            turnStartTime:    null,
            turnDuration:     60,
            deck:             deck,
            currentCardIndex: deck[0],
            describerId:      null,
            lastDescriberId:  null,
            // FIX #10 — no resetTimestamp on fresh room
            resetTimestamp:   null
        };
    }

    // FIX #1 — use runTransaction to safely create room only if absent,
    // preventing race condition when two players enter simultaneously.
    async connect() {
        const roomRef = this.roomRef;
        const initialState = this._buildInitialState();

        await runTransaction(roomRef, (currentData) => {
            if (currentData === null) {
                // Room doesn't exist — create it atomically
                return initialState;
            }
            // Room already exists — leave it untouched
            return currentData;
        });
    }

    registerPresence() {
        const roomId = this.roomRef.key;
        const myPresenceRef = ref(db, `rooms/${roomId}/players/${myPlayerId}`);
        set(myPresenceRef, { joinTime: myJoinTime, active: true });
        onDisconnect(myPresenceRef).remove();
    }

    listenToState() {
        onValue(this.roomRef, (snapshot) => {
            const newState = snapshot.val();

            // Room deleted
            if (!newState) { goToLobby(); return; }

            // FIX #10 — only trigger reset if resetTimestamp > myJoinTime AND is non-null
            if (newState.resetTimestamp && myJoinTime && newState.resetTimestamp > myJoinTime) {
                goToLobby();
                return;
            }

            this.currentState = newState;

            // Compute playerCount per team
            if (newState.teams) {
                newState.teams.forEach(t => {
                    t.playerCount = t.players ? Object.keys(t.players).length : 0;
                });
            }

            // Room cleanup: last player removes whole room on disconnect
            const allPlayers = newState.players ? Object.keys(newState.players) : [];
            if (allPlayers.length === 1 && allPlayers[0] === this.playerId) {
                onDisconnect(this.roomRef).remove();
            } else {
                onDisconnect(this.roomRef).cancel();
                // Always keep own presence-remove active
                const myPresenceRef = ref(db, `rooms/${this.roomRef.key}/players/${this.playerId}`);
                onDisconnect(myPresenceRef).remove();
            }

            // Admin transfer: if admin is gone, oldest remaining player takes over
            const isAdminPresent = newState.adminId &&
                newState.players && newState.players[newState.adminId];

            if (!isAdminPresent) {
                const sorted = allPlayers
                    .map(id => ({ id, joinTime: (newState.players[id] || {}).joinTime || 0 }))
                    .sort((a, b) => a.joinTime - b.joinTime);
                if (sorted.length > 0 && sorted[0].id === this.playerId) {
                    update(this.roomRef, { adminId: this.playerId });
                    return;
                }
            }

            // Skip empty teams during transitioning
            if (newState.turnStatus === 'transitioning' && newState.teams) {
                const curTeam = newState.teams[newState.currentTeamIndex];
                if (curTeam && curTeam.playerCount === 0) {
                    for (let i = 1; i < newState.teams.length; i++) {
                        const idx = (newState.currentTeamIndex + i) % newState.teams.length;
                        if (newState.teams[idx].playerCount > 0) {
                            update(this.roomRef, { currentTeamIndex: idx });
                            return;
                        }
                    }
                }
            }

            this.events.onStateUpdate(newState);
        });
    }

    async startTurn() {
        await update(this.roomRef, {
            turnStatus:    'active',
            turnStartTime: Date.now(),
            describerId:   this.playerId
        });
    }

    async endTurn() {
        const state = this.currentState;
        if (!state || state.turnStatus !== 'active') return;

        // Find next team with players
        let nextTeamIndex = state.currentTeamIndex;
        for (let i = 1; i <= state.teams.length; i++) {
            const idx = (state.currentTeamIndex + i) % state.teams.length;
            if (state.teams[idx].players && Object.keys(state.teams[idx].players).length > 0) {
                nextTeamIndex = idx;
                break;
            }
        }

        await update(this.roomRef, { turnStatus: 'ended', lastDescriberId: state.describerId });

        // FIX #3 — store timeout reference so it can be cancelled on goToLobby
        endTurnTimeout = setTimeout(async () => {
            endTurnTimeout = null;
            // Guard: turnManager might be null if user left during the 3s window
            if (!turnManager) return;
            await update(this.roomRef, {
                currentTeamIndex: nextTeamIndex,
                turnStatus:       'transitioning',
                turnStartTime:    null,
                describerId:      null
            });
        }, 3000);
    }

    async drawCard(isCorrect) {
        const state = this.currentState;
        if (!state) return;
        if (state.turnStatus !== 'active') return;
        if (state.describerId !== this.playerId) return;

        // FIX #2 — prevent double-tap race condition
        if (isProcessingCard) return;
        isProcessingCard = true;

        try {
            let deck = [...(state.deck || [])];
            const currentCard = deck.shift();

            if (!isCorrect) {
                // Skip → return to bottom of deck
                deck.push(currentCard);
            }
            // Correct → card is permanently removed this round

            const isDeckEmpty = (deck.length === 0);
            if (isDeckEmpty) {
                // FIX #8 — reshuffle excludes cards already scored this session
                // We keep track via usedCardIndices on the state
                const usedSet = new Set(state.usedCardIndices || []);
                // Add currently discarded card to used set if correct
                if (isCorrect) usedSet.add(currentCard);
                // Build fresh pool from cards not yet seen since last full reset
                let pool = Array.from({ length: DECK_SIZE }, (_, i) => i).filter(i => !usedSet.has(i));
                if (pool.length === 0) {
                    // All cards exhausted — full reset
                    pool = Array.from({ length: DECK_SIZE }, (_, i) => i);
                    usedSet.clear();
                }
                deck = shuffleArray(pool);
            }

            const updates = {};

            if (isCorrect) {
                const activeTeam = state.teams[state.currentTeamIndex];
                updates[`teams/${state.currentTeamIndex}/score`] = (activeTeam.score || 0) + 1;
                // Track used cards to avoid repeats (FIX #8)
                const used = [...(state.usedCardIndices || [])];
                if (!used.includes(currentCard)) used.push(currentCard);
                updates.usedCardIndices = used;
            }

            if (isDeckEmpty) {
                const elapsed  = Math.floor((Date.now() - state.turnStartTime) / 1000);
                const timeLeft = Math.max(0, state.turnDuration - elapsed);
                updates.turnStatus       = 'shuffling';
                updates.timeLeft         = timeLeft;
                updates.deck             = deck;
                updates.currentCardIndex = deck[0];
                // Reset used set after full reshuffle
                if (!updates.usedCardIndices) updates.usedCardIndices = state.usedCardIndices || [];
            } else {
                updates.deck             = deck;
                updates.currentCardIndex = deck[0];
            }

            await update(this.roomRef, updates);
        } finally {
            // FIX #2 — always release the lock, even on Firebase error
            isProcessingCard = false;
        }
    }
}

// ─── enterRoom ────────────────────────────────────────────────────────────────
window.enterRoom = async function() {
    const rawName = document.getElementById('room-input').value.trim();
    const errEl   = document.getElementById('room-input-error');

    if (!rawName) {
        errEl.textContent = lang === 'he' ? "אנא הכנס שם חדר!" : "Please enter a room name!";
        errEl.style.display = 'block';
        return;
    }

    // FIX #12 — validate forbidden Firebase path characters
    if (hasInvalidChars(rawName)) {
        errEl.textContent = i18n[lang].roomInvalidChars;
        errEl.style.display = 'block';
        return;
    }
    errEl.style.display = 'none';

    const roomId = rawName; // no silent replacement — show error instead
    uiLobby.style.display = 'none';
    myJoinTime = Date.now();

    const roomRef = ref(db, 'rooms/' + roomId);
    turnManager   = new GameTurnManager(roomRef, myPlayerId);

    // FIX #1 — atomic create-if-absent via transaction
    await turnManager.connect();

    // Register presence AFTER room exists
    turnManager.registerPresence();

    turnManager.events.onStateUpdate = (state) => renderState(state);
    turnManager.listenToState();
};

// ─── goToLobby ────────────────────────────────────────────────────────────────
window.goToLobby = function() {
    // FIX #3 — cancel pending endTurn timeout
    if (endTurnTimeout) { clearTimeout(endTurnTimeout); endTurnTimeout = null; }

    if (turnManager) {
        const roomId = turnManager.roomRef.key;
        const myPresenceRef = ref(db, `rooms/${roomId}/players/${myPlayerId}`);
        onDisconnect(myPresenceRef).cancel();
        remove(myPresenceRef);

        if (myTeamId) {
            const tIdx = (turnManager.currentState?.teams || []).findIndex(t => t.id === myTeamId);
            if (tIdx >= 0) {
                const tRef = ref(db, `rooms/${roomId}/teams/${tIdx}/players/${myPlayerId}`);
                onDisconnect(tRef).cancel();
                remove(tRef);
            }
        }
        turnManager.events.onStateUpdate = () => {};
        turnManager = null;
    }

    myTeamId              = null;
    myPlayerNumber        = null;
    isEditMode            = false;
    lastDisplayedCardIndex = -1;
    isProcessingCard      = false; // FIX #2 — reset lock on lobby return

    if (localTimerInterval)       { clearInterval(localTimerInterval);      localTimerInterval      = null; }
    if (window._shufflingTimeout) { clearTimeout(window._shufflingTimeout); window._shufflingTimeout = null; }

    uiLobby.style.display = 'flex';
    uiModal.classList.add('hidden');
    document.getElementById('winner-modal').classList.add('hidden');
    document.getElementById('shuffling-ui').classList.add('hidden');
    uiCardContainer.classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    uiRoleMessage.classList.add('hidden');
    uiBtnStartTurn.classList.add('hidden');

    updatePlayerInfoDisplay();
    uiPlayersCount.textContent = i18n[lang].waitingPlayers;
    uiTimer.textContent        = '01:00';
    uiStatus.textContent       = i18n[lang].waitingPlayers;
};

// ─── selectTeam ───────────────────────────────────────────────────────────────
window.selectTeam = async function(teamId) {
    if (!turnManager || !turnManager.currentState) return;
    if (myTeamId === teamId) return;

    const state  = turnManager.currentState;
    const roomId = turnManager.roomRef.key;

    // Leave old team
    for (let i = 0; i < state.teams.length; i++) {
        if (state.teams[i].players && state.teams[i].players[myPlayerId]) {
            const oldRef = ref(db, `rooms/${roomId}/teams/${i}/players/${myPlayerId}`);
            onDisconnect(oldRef).cancel();
            await remove(oldRef);
        }
    }

    // Join new team — FIX #4: use timestamp-based unique number
    const teamIndex    = state.teams.findIndex(t => t.id === teamId);
    const teamPlayers  = state.teams[teamIndex].players || {};
    const existingNums = Object.values(teamPlayers).map(p => p.num || 0);
    // Use a timestamp-derived number to avoid duplicates across simultaneous joins
    const pNumber = existingNums.length > 0 ? Math.max(...existingNums) + 1 : 1;

    const playerRef = ref(db, `rooms/${roomId}/teams/${teamIndex}/players/${myPlayerId}`);
    onDisconnect(playerRef).remove();
    await set(playerRef, { num: pNumber, active: true, joinTime: Date.now() });

    myTeamId       = teamId;
    myPlayerNumber = pNumber;
    updatePlayerInfoDisplay();
    highlightSelectedTeamBtn();
    renderState(turnManager.currentState);
};

function highlightSelectedTeamBtn() {
    document.querySelectorAll('#modal-team-buttons .team-btn').forEach(btn => {
        btn.style.border = '3px solid transparent';
    });
    if (myTeamId) {
        const btn = document.querySelector(`#modal-team-buttons .team-btn.${myTeamId}`);
        if (btn) btn.style.border = '3px solid #333';
    }
}

// ─── Difficulty ───────────────────────────────────────────────────────────────
window.setDifficulty = function(level) {
    if (!turnManager?.currentState) return;
    if (turnManager.currentState.adminId !== myPlayerId) return;
    pendingDifficulty = level;
    updateDifficultyUI(level);
};

function updateDifficultyUI(level) {
    const isAdmin = turnManager?.currentState?.adminId === myPlayerId;
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.style.backgroundColor = '#f9f9f9';
        btn.style.borderColor     = '#ddd';
        btn.style.color           = '#666';
        btn.style.opacity         = isAdmin ? '1' : '0.6';
        btn.style.cursor          = isAdmin ? 'pointer' : 'not-allowed';
    });
    const map = {
        easy:   { el:'diff-easy',   bg:'#d5f5e3', border:'#2ecc71', color:'#27ae60' },
        medium: { el:'diff-medium', bg:'#fcf3cf', border:'#f1c40f', color:'#f39c12' },
        hard:   { el:'diff-hard',   bg:'#fadbd8', border:'#e74c3c', color:'#c0392b' }
    };
    if (map[level]) {
        const b = document.getElementById(map[level].el);
        b.style.backgroundColor = map[level].bg;
        b.style.borderColor     = map[level].border;
        b.style.color           = map[level].color;
    }
}

// ─── startGame ────────────────────────────────────────────────────────────────
window.startGame = function() {
    if (!myTeamId) {
        alert(lang === 'he' ? "אנא בחר קבוצה קודם!" : "Please select a team first!");
        return;
    }
    update(turnManager.roomRef, { gameStarted: true, difficulty: pendingDifficulty });
};

// ─── resumePlay (after shuffling) ────────────────────────────────────────────
window.resumePlay = async function() {
    if (!turnManager?.currentState) return;
    const state = turnManager.currentState;

    // FIX #7 — only the current describer can resume
    if (state.describerId !== myPlayerId) return;

    await update(turnManager.roomRef, {
        turnStatus:    'active',
        turnStartTime: Date.now() - (state.turnDuration - (state.timeLeft || 0)) * 1000,
        timeLeft:      null
    });
};

// ─── openSettings ────────────────────────────────────────────────────────────
window.openSettings = function() {
    if (!turnManager?.currentState) return;
    isEditMode = true;
    pendingDifficulty = turnManager.currentState.difficulty;
    updateDifficultyUI(pendingDifficulty);

    const isAdmin = turnManager.currentState.adminId === myPlayerId;

    uiModal.classList.remove('hidden');
    document.getElementById('admin-setup-controls').classList.add('hidden');
    document.getElementById('team-selection-group').classList.add('hidden');
    document.getElementById('difficulty-group').classList.remove('hidden');
    document.getElementById('admin-edit-controls').classList.remove('hidden');
    document.getElementById('non-admin-msg').classList.add('hidden');

    if (isAdmin) {
        document.getElementById('non-admin-note').classList.add('hidden');
        document.getElementById('btn-change-teams').classList.remove('hidden');
        document.getElementById('btn-end-game').classList.remove('hidden');
        document.getElementById('btn-modal-confirm').classList.remove('hidden');
        document.getElementById('edit-warning').classList.remove('hidden');
        document.getElementById('btn-modal-cancel').textContent = i18n[lang].cancel;
    } else {
        document.getElementById('non-admin-note').classList.remove('hidden');
        document.getElementById('btn-change-teams').classList.add('hidden');
        document.getElementById('btn-end-game').classList.add('hidden');
        document.getElementById('btn-modal-confirm').classList.add('hidden');
        document.getElementById('edit-warning').classList.add('hidden');
        document.getElementById('btn-modal-cancel').textContent = i18n[lang].close;
    }
};

window.closeModal = function() {
    isEditMode = false;
    uiModal.classList.add('hidden');
    if (turnManager?.currentState) updateDifficultyUI(turnManager.currentState.difficulty);
};

// ─── confirmSettings ──────────────────────────────────────────────────────────
window.confirmSettings = async function() {
    if (turnManager.currentState.adminId !== myPlayerId) return;
    isEditMode = false;
    uiModal.classList.add('hidden');

    const deck    = freshDeck();
    const state   = turnManager.currentState;

    // FIX #6 — find first team index that actually has players
    let firstTeamIdx = 0;
    for (let i = 0; i < state.teams.length; i++) {
        if (state.teams[i].playerCount > 0) { firstTeamIdx = i; break; }
    }

    const updates = {
        difficulty:         pendingDifficulty,
        deck:               deck,
        currentCardIndex:   deck[0],
        turnStatus:         'transitioning',
        turnStartTime:      null,
        describerId:        null,
        lastDescriberId:    null,
        currentTeamIndex:   firstTeamIdx,  // FIX #6
        gameStarted:        true,
        usedCardIndices:    []             // FIX #8 reset
    };
    state.teams.forEach((_, i) => { updates[`teams/${i}/score`] = 0; });
    await update(turnManager.roomRef, updates);
};

// ─── restartToTeamSelection ───────────────────────────────────────────────────
window.restartToTeamSelection = async function() {
    if (turnManager.currentState.adminId !== myPlayerId) return;
    isEditMode = false;
    uiModal.classList.add('hidden');
    document.getElementById('winner-modal').classList.add('hidden');

    const state   = turnManager.currentState;
    const updates = {
        gameStarted:      false,
        turnStatus:       'transitioning',
        turnStartTime:    null,
        describerId:      null,
        lastDescriberId:  null,
        currentTeamIndex: 0,
        usedCardIndices:  []  // FIX #8 reset
    };
    state.teams.forEach((_, i) => { updates[`teams/${i}/score`] = 0; });
    await update(turnManager.roomRef, updates);
};

// ─── endGameAndReset ──────────────────────────────────────────────────────────
// FIX #10 — after broadcasting resetTimestamp, admin goes to lobby too.
// When admin re-enters the same room name, connect() via runTransaction will
// find the old record. We clear resetTimestamp inside the transaction so a
// returning admin always gets a clean slate.
window.endGameAndReset = async function() {
    if (turnManager.currentState.adminId !== myPlayerId) return;
    // Broadcast reset to all OTHER players
    await update(turnManager.roomRef, { resetTimestamp: Date.now() });
    // Admin also leaves — goToLobby cleans up presence
    goToLobby();
};

// ─── updatePlayerInfoDisplay ─────────────────────────────────────────────────
function updatePlayerInfoDisplay() {
    if (myTeamId && myPlayerNumber) {
        const d       = i18n[lang];
        const isAdmin = turnManager?.currentState?.adminId === myPlayerId;
        const crown   = isAdmin
            ? `<div style="color:#d4af37;font-size:13px;font-weight:900;margin-top:3px;">👑 ${d.roomAdmin}</div>`
            : '';
        uiPlayerInfoDisplay.innerHTML =
            `${d.teamPrefix}${d.teamNames[myTeamId]}${d.teamSuffix} | ${d.playerWord}: ${myPlayerNumber}${crown}`;
        uiPlayerInfoDisplay.style.backgroundColor = teamBgColors[myTeamId];
        uiPlayerInfoDisplay.style.color           = teamColors[myTeamId];
        uiCardContainer.style.backgroundColor     = teamBgColors[myTeamId];
    } else {
        uiPlayerInfoDisplay.innerHTML             = '';
        uiPlayerInfoDisplay.style.backgroundColor = 'transparent';
        uiCardContainer.style.backgroundColor     = 'white';
    }
}

// ─── Board colors ─────────────────────────────────────────────────────────────
function updateBoardColors(teams) {
    for (let i = 0; i <= MAX_STEPS; i++) {
        const sq = document.getElementById('sq-' + i);
        if (sq) sq.style.background = '';
    }
    const map = {};
    teams.forEach(team => {
        if (team.playerCount > 0) {
            const pos = Math.min(team.score || 0, MAX_STEPS);
            if (!map[pos]) map[pos] = [];
            map[pos].push(teamBgColors[team.id]);
        }
    });
    for (const pos in map) {
        const sq = document.getElementById('sq-' + pos);
        if (!sq) continue;
        const colors = map[pos];
        if (colors.length === 1) {
            sq.style.background = colors[0];
        } else {
            const dir      = lang === 'he' ? 'to right' : 'to left';
            const step     = 100 / colors.length;
            const gradient = `linear-gradient(${dir}, ${colors.map((c, i) =>
                `${c} ${i*step}%, ${c} ${(i+1)*step}%`).join(', ')})`;
            sq.style.background = gradient;
        }
    }
}

// ─── Card loader ──────────────────────────────────────────────────────────────
let fadeTimeout;
function loadCardIfNeeded(index, difficultyLevel) {
    if (index === lastDisplayedCardIndex) return;
    lastDisplayedCardIndex = index;

    // FIX #11 — safe card lookup with bounds check
    const cards = i18n[lang].cards;
    const card  = (index >= 0 && index < cards.length) ? cards[index] : null;
    if (!card) return;

    uiCardContainer.classList.add('fade-out');
    clearTimeout(fadeTimeout);
    fadeTimeout = setTimeout(() => {
        document.getElementById('main-word').textContent = card.word;
        document.getElementById('card-icon').textContent = card.icon || '🖼️';

        let limit = 4;
        if (difficultyLevel === 'easy') limit = 2;
        if (difficultyLevel === 'hard') limit = 6;

        const ul = document.getElementById('taboo-words');
        ul.innerHTML = '';
        card.taboo.slice(0, limit).forEach(w => {
            const li = document.createElement('li');
            li.textContent = w;
            ul.appendChild(li);
        });
        uiCardContainer.classList.remove('fade-out');
    }, 300);
}

// ─── Main render ──────────────────────────────────────────────────────────────
function renderState(state) {
    const d       = i18n[lang];
    const isAdmin = state.adminId === myPlayerId;

    updatePlayerInfoDisplay();
    highlightSelectedTeamBtn();

    // ── Modal logic ──────────────────────────────────────────────────────────
    if (!isEditMode) {
        if (!state.gameStarted) {
            uiModal.classList.remove('hidden');
            document.getElementById('team-selection-group').classList.remove('hidden');
            if (isAdmin) {
                document.getElementById('difficulty-group').classList.remove('hidden');
                document.getElementById('admin-setup-controls').classList.remove('hidden');
                document.getElementById('admin-edit-controls').classList.add('hidden');
                document.getElementById('non-admin-msg').classList.add('hidden');
                document.getElementById('non-admin-note').classList.add('hidden');
                pendingDifficulty = state.difficulty || 'medium';
                updateDifficultyUI(pendingDifficulty);
            } else {
                document.getElementById('difficulty-group').classList.add('hidden');
                document.getElementById('admin-setup-controls').classList.add('hidden');
                document.getElementById('admin-edit-controls').classList.add('hidden');
                document.getElementById('non-admin-msg').classList.remove('hidden');
                document.getElementById('non-admin-note').classList.add('hidden');
            }
        } else if (!myTeamId) {
            uiModal.classList.remove('hidden');
            document.getElementById('team-selection-group').classList.remove('hidden');
            document.getElementById('difficulty-group').classList.add('hidden');
            document.getElementById('admin-setup-controls').classList.add('hidden');
            document.getElementById('admin-edit-controls').classList.add('hidden');
            document.getElementById('non-admin-msg').classList.add('hidden');
            document.getElementById('non-admin-note').classList.add('hidden');
        } else {
            uiModal.classList.add('hidden');
        }
    }

    document.getElementById('btn-settings').classList.toggle('hidden', !state.gameStarted);
    updateBoardColors(state.teams);

    const playersText = state.teams
        .filter(t => t.playerCount > 0)
        .map(t => `${d.teamNames[t.id]}: ${t.playerCount}`);
    uiPlayersCount.textContent = playersText.length > 0
        ? `${d.playersConnected} - ${playersText.join(' | ')}`
        : d.waitingChoose;

    // ── FIX #5 — Winner check: only teams with active players ────────────────
    const winnerTeam = state.teams.find(t => (t.score || 0) >= MAX_STEPS && t.playerCount > 0);
    if (winnerTeam) {
        if (localTimerInterval) { clearInterval(localTimerInterval); localTimerInterval = null; }
        uiCardContainer.classList.add('hidden');
        document.getElementById('controls').classList.add('hidden');
        uiRoleMessage.classList.add('hidden');
        uiBtnStartTurn.classList.add('hidden');
        document.getElementById('shuffling-ui').classList.add('hidden');

        document.getElementById('winner-modal').classList.remove('hidden');
        const wt = document.getElementById('winner-title');
        wt.textContent = `${d.winnerPrefix}${d.teamNames[winnerTeam.id]}${d.winnerSuffix}`;
        wt.style.color = teamColors[winnerTeam.id];
        document.getElementById('winner-admin-controls').classList.toggle('hidden', !isAdmin);
        document.getElementById('winner-non-admin-msg').classList.toggle('hidden',  isAdmin);
        return;
    } else {
        document.getElementById('winner-modal').classList.add('hidden');
    }

    if (!state.gameStarted || !myTeamId) return;

    const currentTeam = state.teams[state.currentTeamIndex];
    if (!currentTeam) return;

    // ── Shuffling ────────────────────────────────────────────────────────────
    if (state.turnStatus === 'shuffling') {
        if (localTimerInterval) { clearInterval(localTimerInterval); localTimerInterval = null; }
        uiTimer.textContent = formatTime(state.timeLeft || 0);
        uiCardContainer.classList.add('hidden');
        document.getElementById('controls').classList.add('hidden');
        uiRoleMessage.classList.add('hidden');
        uiBtnStartTurn.classList.add('hidden');
        document.getElementById('shuffling-ui').classList.remove('hidden');

        // FIX #7 — only the active describer controls the shuffle resume
        const isDescriber = state.describerId === myPlayerId;
        document.getElementById('shuffling-loader').classList.remove('hidden');
        document.getElementById('btn-resume-play').classList.add('hidden');

        if (isDescriber && !window._shufflingTimeout) {
            window._shufflingTimeout = setTimeout(() => {
                window._shufflingTimeout = null;
                // FIX #7 — verify this player is still the describer before showing button
                if (turnManager?.currentState?.describerId === myPlayerId &&
                    turnManager?.currentState?.turnStatus === 'shuffling') {
                    document.getElementById('shuffling-loader').classList.add('hidden');
                    document.getElementById('btn-resume-play').classList.remove('hidden');
                }
            }, 5000);
        }
        return;
    } else {
        document.getElementById('shuffling-ui').classList.add('hidden');
        if (window._shufflingTimeout) { clearTimeout(window._shufflingTimeout); window._shufflingTimeout = null; }
    }

    // ── Timer ────────────────────────────────────────────────────────────────
    if (state.turnStatus === 'active') {
        if (!localTimerInterval) {
            localTimerInterval = setInterval(() => {
                const cur = turnManager?.currentState;
                if (!cur || cur.turnStatus !== 'active') {
                    clearInterval(localTimerInterval); localTimerInterval = null; return;
                }
                const elapsed  = Math.floor((Date.now() - cur.turnStartTime) / 1000);
                const timeLeft = Math.max(0, cur.turnDuration - elapsed);
                uiTimer.textContent = formatTime(timeLeft);
                if (timeLeft <= 0 && cur.describerId === myPlayerId) {
                    turnManager.endTurn();
                }
            }, 250);
        }
    } else {
        if (localTimerInterval) { clearInterval(localTimerInterval); localTimerInterval = null; }
        uiTimer.textContent = formatTime(state.turnDuration);
    }

    // ── Active turn ──────────────────────────────────────────────────────────
    if (state.turnStatus === 'active') {
        uiBtnStartTurn.classList.add('hidden');
        uiStatus.style.fontSize = '16px';
        uiStatus.textContent    = `${d.playingNow}${d.teamNames[currentTeam.id]}${d.teamSuffix}!`;
        uiStatus.style.color    = teamColors[currentTeam.id];

        if (myTeamId !== currentTeam.id) {
            uiRoleMessage.classList.add('hidden');
            uiCardContainer.classList.remove('hidden');
            document.getElementById('controls').classList.add('hidden');
            uiCardRoleTitle.textContent = d.roleInspector;
            loadCardIfNeeded(state.currentCardIndex, state.difficulty);
        } else if (state.describerId === myPlayerId) {
            uiRoleMessage.classList.add('hidden');
            uiCardContainer.classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            uiCardRoleTitle.textContent = d.roleDescriber;
            loadCardIfNeeded(state.currentCardIndex, state.difficulty);
        } else {
            uiCardContainer.classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            uiRoleMessage.classList.remove('hidden');
            uiRoleMessage.textContent = d.roleGuesser;
        }
        return;
    }

    // ── Between turns ────────────────────────────────────────────────────────
    uiCardContainer.classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    uiRoleMessage.classList.add('hidden');
    lastDisplayedCardIndex = -1;

    if (state.turnStatus === 'ended') {
        uiStatus.textContent    = d.timeUp;
        uiStatus.style.fontSize = '18px';
        uiStatus.style.color    = '#e74c3c';
        uiBtnStartTurn.classList.add('hidden');
    } else {
        // transitioning
        uiStatus.style.fontSize = '20px';
        uiStatus.style.color    = teamColors[currentTeam.id] || '#333';
        uiStatus.textContent    = `${d.turnOf}${d.teamNames[currentTeam.id]}${d.teamSuffix}!`;

        if (myTeamId === currentTeam.id) {
            const canStart = !(currentTeam.playerCount > 1 && state.lastDescriberId === myPlayerId);
            if (canStart) {
                uiBtnStartTurn.classList.remove('hidden');
            } else {
                uiBtnStartTurn.classList.add('hidden');
                uiStatus.textContent = d.waitTeammate;
            }
        } else {
            uiBtnStartTurn.classList.add('hidden');
        }
    }
}

// ─── Button wiring ────────────────────────────────────────────────────────────
uiBtnStartTurn.addEventListener('click', () => { if (turnManager) turnManager.startTurn(); });
document.getElementById('btn-correct').addEventListener('click', () => { if (turnManager) turnManager.drawCard(true); });
document.getElementById('btn-skip').addEventListener('click',    () => { if (turnManager) turnManager.drawCard(false); });

// Allow Enter key in room input
document.getElementById('room-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterRoom();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
updateStaticText();
</script>
